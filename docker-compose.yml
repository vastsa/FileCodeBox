version: "3"
services:
  file-code-box:
    image: lanol/filecodebox:2.8.0 # x-release-please-version
    volumes:
      - fcb-data:/app/data:rw
      # NAS 已有文件：把共享目录挂到 /app/data/local，即可在后台「本地分享」里生成提取码，无需再上传
      # - /volume1/share:/app/data/local:ro
    restart: unless-stopped
    ports:
      - "12345:12345"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=warning
      - ACCESS_LOG=false
      - WORKERS=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  fcb-data:
    external: false
